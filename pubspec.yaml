name: flora_scan
description: "Global Bio-Telemetry & AI Diagnostics Plant Care App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.8.3

  # Camera & Media
  camera: ^0.11.0+2
  image: ^4.5.3

  # Sensors
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Local Storage (offline queue)
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  connectivity_plus: ^6.1.1
  collection: ^1.19.1
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
