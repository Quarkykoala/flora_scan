  <text x="142" y="458" class="t">`/scan`</text>
  <text x="142" y="484" class="t">Camera + telemetry capture</text>
  <text x="142" y="508" class="t">Deep AI toggle + paywall</text>
  <rect x="142" y="530" width="118" height="24" class="tab"/><text x="154" y="547" class="tabText">Freemium Gate</text>

