<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3fbf4"/>
      <stop offset="100%" stop-color="#e1f1e6"/>
    </linearGradient>
    <style>
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #124d2b; }
      .sub { font: 500 18px "Segoe UI", Arial, sans-serif; fill: #2d5f3d; }
      .screen { fill: #fff; stroke: #90c6a0; stroke-width: 2; rx: 18; }
      .h { font: 700 20px "Segoe UI", Arial, sans-serif; fill: #0f4b2b; }
      .t { font: 500 15px "Segoe UI", Arial, sans-serif; fill: #274734; }
      .tab { fill: #d8f0de; stroke: #87c29a; stroke-width: 1.4; rx: 12; }
      .tabText { font: 600 13px "Segoe UI", Arial, sans-serif; fill: #175632; }
      .arrow { stroke: #2f9d59; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9d59"/>
    </marker>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>
  <text x="52" y="64" class="title">FloraScan Screen Map</text>
