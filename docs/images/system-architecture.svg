<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f0"/>
      <stop offset="100%" stop-color="#dff0e4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f4fbf6" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      .title { font: 700 36px "Segoe UI", Arial, sans-serif; fill: #124d2b; }
      .subtitle { font: 600 18px "Segoe UI", Arial, sans-serif; fill: #2a5e3c; }
      .h { font: 700 22px "Segoe UI", Arial, sans-serif; fill: #0f4a2b; }
      .t { font: 500 16px "Segoe UI", Arial, sans-serif; fill: #1f3f2f; }
      .cap { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #2f6441; letter-spacing: .3px; }
      .node { fill: url(#panel); stroke: #8dc39b; stroke-width: 2; rx: 18; }
      .group { fill: #ffffff; fill-opacity: .45; stroke: #8ec29f; stroke-width: 2; rx: 24; }
      .arrow { stroke: #2f9d59; stroke-width: 3; fill: none; marker-end: url(#m); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9d59"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="860" fill="url(#bg)"/>
  <text x="52" y="64" class="title">FloraScan System Architecture</text>
  <text x="52" y="94" class="subtitle">Offline-first mobile telemetry + cloud enrichment + AI diagnostics + recovery intelligence</text>

  <rect x="48" y="128" width="420" height="680" class="group"/>
  <text x="70" y="165" class="h">Flutter Mobile App</text>
  <rect x="76" y="190" width="364" height="95" class="node"/>
  <text x="98" y="228" class="h">Capture Layer</text>
  <text x="98" y="255" class="t">Camera, sensors, GPS, orientation, haptics</text>

  <rect x="76" y="305" width="364" height="95" class="node"/>
  <text x="98" y="343" class="h">Offline Queue</text>
  <text x="98" y="370" class="t">PendingScan, idempotent client_scan_id, retries</text>

  <rect x="76" y="420" width="364" height="95" class="node"/>
  <text x="98" y="458" class="h">UX Layer</text>
  <text x="98" y="485" class="t">Glass diagnosis cards, missions, paywall, chat lock</text>

  <rect x="76" y="535" width="364" height="95" class="node"/>
  <text x="98" y="573" class="h">Engagement</text>
  <text x="98" y="600" class="t">Notifications, follow-up outcomes, analytics events</text>

  <rect x="490" y="128" width="500" height="680" class="group"/>
  <text x="512" y="165" class="h">Supabase Backend</text>
  <rect x="518" y="190" width="444" height="95" class="node"/>
  <text x="540" y="228" class="h">Auth + RLS</text>
  <text x="540" y="255" class="t">JWT users, optional B2B x-api-key auth middleware</text>

  <rect x="518" y="305" width="444" height="95" class="node"/>
  <text x="540" y="343" class="h">Storage + Postgres</text>
  <text x="540" y="370" class="t">Private images, Golden Record schema, recovery loop tables</text>

  <rect x="518" y="420" width="444" height="95" class="node"/>
  <text x="540" y="458" class="h">Edge Functions Pipeline</text>
  <text x="540" y="485" class="t">create-scan, enrich-weather, enrich-air, diagnose-ai</text>

  <rect x="518" y="535" width="444" height="95" class="node"/>
  <text x="540" y="573" class="h">Outcome + Observability</text>
  <text x="540" y="600" class="t">submit-intervention-outcome, log-analytics-event</text>

  <rect x="1012" y="128" width="340" height="680" class="group"/>
  <text x="1034" y="165" class="h">External Services</text>
  <rect x="1040" y="190" width="284" height="95" class="node"/>
  <text x="1062" y="228" class="h">Gemini Flash</text>
  <text x="1062" y="255" class="t">Diagnosis + treatment recommendations</text>

  <rect x="1040" y="305" width="284" height="95" class="node"/>
  <text x="1062" y="343" class="h">Open-Meteo</text>
  <text x="1062" y="370" class="t">Temperature, humidity, radiation, ET0, VPD</text>

  <rect x="1040" y="420" width="284" height="95" class="node"/>
  <text x="1062" y="458" class="h">Air Quality API</text>
  <text x="1062" y="485" class="t">AQI, PM2.5, PM10, NO2, O3</text>

  <rect x="1040" y="535" width="284" height="95" class="node"/>
  <text x="1062" y="573" class="h">Commerce + Payments</text>
  <text x="1062" y="600" class="t">Affiliate search intents + Dodo checkout</text>

  <path d="M440 352 C 468 352, 490 352, 518 352" class="arrow"/>
  <path d="M440 468 C 468 468, 490 468, 518 468" class="arrow"/>
  <path d="M440 582 C 468 582, 490 582, 518 582" class="arrow"/>
  <path d="M962 468 C 992 468, 1012 240, 1040 240" class="arrow"/>
  <path d="M962 468 C 992 468, 1012 354, 1040 354" class="arrow"/>
  <path d="M962 468 C 992 468, 1012 468, 1040 468" class="arrow"/>
  <path d="M962 582 C 992 582, 1012 582, 1040 582" class="arrow"/>

  <text x="52" y="836" class="cap">Golden Record = image + telemetry + diagnosis + quality + versions</text>
  <text x="730" y="836" class="cap">Recovery Loop = recommendation + adherence + outcome (+ optional follow-up scan)</text>
</svg>

